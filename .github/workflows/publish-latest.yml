name: Publish latest channel

# main에 푸시되면 릴리스 APK를 빌드해 고정 태그 `latest`에 덮어씁니다.
# 앱은 시작 시 이 채널의 update.json을 보고 자동 업데이트합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 시크릿이 없습니다."
            echo "로컬에서 scripts/setup-ci-signing.ps1 을 한 번 실행하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > lotte-release.jks
          printf 'storeFile=lotte-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Read version from APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Prepare latest assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/LotteGiants.apk
          printf '{"versionCode":%s,"versionName":"%s","apkFileName":"LotteGiants.apk","notes":"main #%s %s"}\n' \
            "${{ env.VERSION_CODE }}" "${{ env.VERSION_NAME }}" \
            "${{ github.run_number }}" "${{ github.sha }}" > dist/update.json
          {
            echo "versionCode: ${{ env.VERSION_CODE }}"
            echo ""
            echo "## latest 채널"
            echo "- versionName: ${{ env.VERSION_NAME }}"
            echo "- commit: ${{ github.sha }}"
            echo "- run: #${{ github.run_number }}"
          } > dist/notes.md

      - name: Publish / overwrite latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 제목은 v{versionName}-{yyMMdd} (KST). 태그는 앱 업데이트 확인이 쓰므로 latest 고정.
          TITLE="v${{ env.VERSION_NAME }}-$(TZ=Asia/Seoul date +%y%m%d)"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/LotteGiants.apk dist/update.json --clobber
            # v1.x 등 다른 태그가 GitHub "Latest" 배지를 가져가지 않게 고정
            gh release edit latest --notes-file dist/notes.md --title "$TITLE" --latest
          else
            gh release create latest dist/LotteGiants.apk dist/update.json \
              --notes-file dist/notes.md \
              --title "$TITLE" \
              --latest
          fi
